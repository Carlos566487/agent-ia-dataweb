[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agente-ia-dataweb"
version = "0.1.0"
description = "Embedding de documentos internos em PDF otimizado para portugues"
requires-python = ">=3.12"
dependencies = [
    "pypdf>=6.0",
    "sentence-transformers>=5.0",
    "chromadb>=1.0",
    "anthropic>=0.70",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "google-genai>=1.0",
    "python-dotenv>=1.0",
]

[project.scripts]
dataweb = "index:main"

[tool.setuptools]
packages = ["src"]
py-modules = ["index"]
